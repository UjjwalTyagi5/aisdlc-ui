# Local development infrastructure — application containers are NOT included here.
#
# Prerequisites: Docker Desktop must be installed and running.
#   Download: https://www.docker.com/products/docker-desktop/
#
# Usage:
#   Start:              docker compose up -d
#   Stop:               docker compose down
#   Stop + delete data: docker compose down -v
#   View logs:          docker compose logs -f [service]
#
# Databases:
#   App DB:      sdlc_agentic  — used by FastAPI (POSTGRES_CONN_STRING=postgresql+asyncpg://sdlc:sdlcdev@localhost:5432/sdlc_agentic)
# Ports exposed on host:
#   5433  — Postgres (5432 is taken by this machine's native PostgreSQL 16 service,
#           which holds the real application schema — see the postgres service below)
#   6379  — Redis

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sdlc-postgres
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlcdev
      POSTGRES_DB: sdlc_agentic
    ports:
      # Host port 5433, NOT 5432. This machine runs a native PostgreSQL 16 service
      # that already owns 5432 and holds the migrated application schema. Binding
      # both to 5432 "succeeds" (native on IPv6, Docker on IPv4) and then which one
      # a client reaches depends on how localhost resolves — the app would silently
      # talk to an empty database. Other services are unaffected: they reach this container
      # as POSTGRES_SEEDS=postgres over the compose network, not via the host port.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc_agentic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sdlc-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  litellm-proxy:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: sdlc-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
