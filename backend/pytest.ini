[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# THE FLAGS ARE ALL HERE. `--ignore` is not an ini key of its own; on its own line it
# is silently not a setting, and the file still parses.
addopts =
    --import-mode=importlib
    --ignore=agents_orchestrator/monitoring_feedback_agent/test_pipeline.py
    --ignore=agents_orchestrator/monitoring_feedback_agent/test_router_logic.py

# CLONED REPOSITORIES ARE NOT OUR TEST SUITE. Every target dialog clones into
# files/dev-workspace/, inside this tree, and one of those clones was a checkout of
# this codebase - so `pytest` walked into it, tried to collect its tests alongside
# ours, and died at collection with "Plugin already registered under a different
# name". The whole suite stopped running for anyone who had ever prepared a target,
# and the error named a plugin rather than the clone.
norecursedirs = files .venv .git node_modules .pytest_cache .mypy_cache

# The two ignored files above are NAMED LIKE TESTS AND HAVE NEVER RUN AS ONE. Both
# import their subject by bare module name (`from pipeline_controller import ...`),
# which resolves only with that directory as the working directory, so collecting them
# from anywhere else fails outright. They are hand-run scratch scripts - sample log
# text, a simulated user message - and making them collectable would fire live model
# calls from the suite. Excluded so the rest of the suite can run, and named here so
# it reads as a decision rather than a silence.

markers =
    unit: Unit tests (no live infrastructure required)
    integration: Integration tests (require docker-compose services)
