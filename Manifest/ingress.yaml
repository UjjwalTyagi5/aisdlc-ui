# HTTPS is REQUIRED, not a nice-to-have. next.config.ts ships `upgrade-insecure-requests`
# in the production CSP, so over plain HTTP the browser rewrites every /_next/static asset
# request to https:// — with no TLS listener those all fail and the page renders as raw
# unstyled HTML. The server returns 200 for those assets the whole time, so this looks
# nothing like a server fault. Do not remove the tls block.
#
# The cert is issued by cert-manager via the `letsencrypt-prod` ClusterIssuer (created
# out-of-band by infra.sh) using an HTTP-01 challenge, and auto-renews.
# The host is <static-ip>.nip.io; nip.io resolves any *.<ip>.nip.io to that IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: aisdlc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # Next.js streams (SSE/chat) — don't let nginx buffer or time them out early.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aisdlc.20.216.44.167.nip.io
      secretName: frontend-tls
  rules:
    - host: aisdlc.20.216.44.167.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
